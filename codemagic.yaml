workflows:
  razaq_task_android:
    name: RAZAQ TASK Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.aistudio.razaktask.rzkmtp"

    scripts:
      - name: Install Gradle 9.3.1
        script: |
          curl -L https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-9.3.1/bin/gradle --version

      - name: Build Android APK
        script: |
          /tmp/gradle-9.3.1/bin/gradle assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
